# Onekof Platform — Tier 2 Production
# =====================================
#
# Self-hosted production stack for Ethiopian server deployment
# (EthioTelecom VM, on-premise server, or any Linux host).
#
# REQUIREMENTS:
#   - Docker Engine 24+ and Docker Compose plugin
#   - .env.production file at repo root (copy from .env.production.example)
#   - Caddyfile at repo root (for SSL termination)
#   - Ports 80 and 443 open on the host firewall
#
# QUICK START (first deploy):
#   1. cp .env.production.example .env.production
#   2. Fill in all values in .env.production
#   3. docker compose -f docker-compose.prod.yml up -d
#   4. docker compose -f docker-compose.prod.yml exec onekof-web \
#        npx prisma migrate deploy \
#        --schema /app/packages/database/prisma/schema.prisma
#   5. Verify: curl -f https://<your-domain>/api/health
#
# UPDATES:
#   1. Pull new image: docker compose -f docker-compose.prod.yml pull onekof-web
#   2. Run migrations (if any): see step 4 above
#   3. Restart: docker compose -f docker-compose.prod.yml up -d onekof-web
#
# LOGS:
#   docker compose -f docker-compose.prod.yml logs -f onekof-web
#
# TEARDOWN (keeps data):
#   docker compose -f docker-compose.prod.yml down
#
# WIPE DATA (destructive):
#   docker compose -f docker-compose.prod.yml down -v

services:

  # ==========================================================================
  # PostgreSQL 15 — primary database
  # ==========================================================================
  postgres:
    image: ankane/pgvector:pg15
    container_name: onekof-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOT exposed to host — only accessible within onekof-prod network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - onekof-prod
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================================================
  # Redis 7 — rate limiting, caching, session store
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: onekof-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - onekof-prod
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # Onekof Web — Next.js app (standalone, ~300 MB)
  # ==========================================================================
  onekof-web:
    image: ${DOCKER_IMAGE:-ghcr.io/daps-analytics/onekof-web:latest}
    container_name: onekof-web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - onekof_blobs:/var/onekof/blobs
    expose:
      - "3000"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/',{headers:{host:'localhost'}},r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - onekof-prod
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ==========================================================================
  # Caddy — reverse proxy with automatic Let's Encrypt SSL
  # ==========================================================================
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: onekof-caddy
    restart: always
    depends_on:
      - onekof-web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    env_file:
      - .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - onekof-prod
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

# ============================================================================
# VOLUMES — data survives container restarts and image updates
# ============================================================================
volumes:
  postgres_data:
    name: onekof_prod_postgres
  redis_data:
    name: onekof_prod_redis
  onekof_blobs:
    name: onekof_prod_blobs
  caddy_data:
    name: onekof_prod_caddy_data
  caddy_config:
    name: onekof_prod_caddy_config
  caddy_logs:
    name: onekof_prod_caddy_logs

# ============================================================================
# NETWORK — internal bridge; only Caddy is exposed to the internet
# ============================================================================
networks:
  onekof-prod:
    name: onekof_prod_network
    driver: bridge
