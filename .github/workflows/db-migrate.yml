name: DB Migrate

# Manually-triggered production migration runner.
# Applies one idempotent migration folder to Supabase via the non-pooled
# DIRECT_URL, then records it in _prisma_migrations so `migrate status`
# stays truthful. Only works with hand-authored idempotent SQL migrations
# (house style — see packages/database/prisma/migrations/README.md).

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration folder name to apply (must be idempotent SQL)'
        required: true
        default: '20260727_add_sprint_budget_snapshot'

jobs:
  migrate:
    name: Apply migration to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration status (before)
        working-directory: packages/database
        run: pnpm exec prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # The DB password contains characters psql's URL parser mis-splits on
      # (unencoded '@'), so decode the URL with Node's WHATWG parser and hand
      # psql discrete PG* variables instead of the raw URL.
      - name: Export PG connection variables
        run: |
          node -e '
            const u = new URL(process.env.DIRECT_URL);
            const out = [
              ["PGHOST", u.hostname],
              ["PGPORT", u.port || "5432"],
              ["PGUSER", decodeURIComponent(u.username)],
              ["PGPASSWORD", decodeURIComponent(u.password)],
              ["PGDATABASE", u.pathname.replace(/^\//, "") || "postgres"],
              ["PGSSLMODE", "require"],
            ];
            const fs = require("fs");
            for (const [k, v] of out) {
              fs.appendFileSync(process.env.GITHUB_ENV, `${k}=${v}\n`);
              console.log(`::add-mask::${v}`);
            }
          '
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Apply idempotent migration SQL
        run: psql -v ON_ERROR_STOP=1 -f "packages/database/prisma/migrations/${{ inputs.migration }}/migration.sql"

      - name: Record migration as applied
        working-directory: packages/database
        run: pnpm exec prisma migrate resolve --applied "${{ inputs.migration }}" || echo "Already recorded in _prisma_migrations"
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Verification was hard-coded to the sprint migration that first needed
      # this workflow. Running it for anything else printed sprint indexes and
      # said nothing about what had just been applied — a green run that
      # verified the wrong thing, which is worse than no verification because
      # it reads as confirmation.
      #
      # Now it reports what the named migration actually created, by diffing
      # the objects the SQL file mentions against what exists.
      - name: Verify objects
        run: |
          echo "--- recorded migrations (latest 6):"
          psql -c "SELECT migration_name, finished_at FROM _prisma_migrations ORDER BY started_at DESC LIMIT 6;"

          SQL="packages/database/prisma/migrations/${{ inputs.migration }}/migration.sql"

          echo "--- tables this migration references, and whether they now exist:"
          grep -oiE '(CREATE TABLE( IF NOT EXISTS)?|ALTER TABLE)[[:space:]]+"?public"?\."?[a-z_]+' "$SQL" \
            | grep -oE '[a-z_]+$' | sort -u | while read -r t; do
              n=$(psql -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='$t';")
              echo "  $t: $( [ "$n" = "1" ] && echo present || echo MISSING )"
            done

          echo "--- columns this migration adds, and whether they now exist:"
          grep -oiE 'ADD COLUMN( IF NOT EXISTS)? "[a-z_]+"' "$SQL" \
            | grep -oE '"[a-z_]+"$' | tr -d '"' | sort -u | while read -r c; do
              n=$(psql -At -c "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND column_name='$c';")
              echo "  $c: $( [ "$n" -ge 1 ] && echo present || echo MISSING )"
            done

          echo "--- indexes this migration creates:"
          grep -oiE 'CREATE (UNIQUE )?INDEX( IF NOT EXISTS)? "[a-z_]+"' "$SQL" \
            | grep -oE '"[a-z_]+"$' | tr -d '"' | sort -u | while read -r i; do
              n=$(psql -At -c "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname='$i';")
              echo "  $i: $( [ "$n" = "1" ] && echo present || echo MISSING )"
            done

          echo "--- foreign keys this migration creates, with their delete rule:"
          grep -oiE 'ADD CONSTRAINT "[a-z_]+"' "$SQL" \
            | grep -oE '"[a-z_]+"$' | tr -d '"' | sort -u | while read -r fk; do
              rule=$(psql -At -c "SELECT delete_rule FROM information_schema.referential_constraints WHERE constraint_name='$fk';")
              echo "  $fk: ${rule:-MISSING}"
            done
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Migration status (after)
        working-directory: packages/database
        run: pnpm exec prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
