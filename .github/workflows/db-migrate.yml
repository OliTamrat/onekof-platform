name: DB Migrate

# Manually-triggered production migration runner.
# Applies one idempotent migration folder to Supabase via the non-pooled
# DIRECT_URL, then records it in _prisma_migrations so `migrate status`
# stays truthful. Only works with hand-authored idempotent SQL migrations
# (house style — see packages/database/prisma/migrations/README.md).

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration folder name to apply (must be idempotent SQL)'
        required: true
        default: '20260726_add_sprints_and_project_settings'

jobs:
  migrate:
    name: Apply migration to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration status (before)
        working-directory: packages/database
        run: pnpm exec prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Apply idempotent migration SQL
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f "packages/database/prisma/migrations/${{ inputs.migration }}/migration.sql"
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Record migration as applied
        working-directory: packages/database
        run: pnpm exec prisma migrate resolve --applied "${{ inputs.migration }}" || echo "Already recorded in _prisma_migrations"
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Verify objects
        run: |
          echo "--- sprints indexes:"
          psql "$DIRECT_URL" -c "SELECT indexname FROM pg_indexes WHERE schemaname='public' AND tablename='sprints';"
          echo "--- new tasks columns:"
          psql "$DIRECT_URL" -c "SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='tasks' AND (column_name LIKE 'sprint%' OR column_name='story_points');"
          echo "--- project_settings table:"
          psql "$DIRECT_URL" -c "SELECT count(*) AS project_settings_exists FROM information_schema.tables WHERE table_schema='public' AND table_name='project_settings';"
          echo "--- organization_settings new columns:"
          psql "$DIRECT_URL" -c "SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='organization_settings' AND column_name IN ('sprints_enabled_default','estimation_unit_default','enforce_workflow_default','terminology_scheme');"
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Migration status (after)
        working-directory: packages/database
        run: pnpm exec prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
