name: CI

on:
  pull_request:
    branches: [master, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      # Without these, the docs-truth job can never run on the PRs that
      # change what it checks — a checker that skips exactly when it
      # matters is worse than none.
      - 'docs/**'
      - 'scripts/docs-truth.mjs'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Type Check + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env vars
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Must precede the build. The web app imports Prisma types through
      # packages/database, which re-exports @prisma/client, and those types
      # only exist once the client is generated from the current schema.
      # Generating afterwards meant the build depended on @prisma/client's own
      # install hook happening to run first — so adding a model or enum to the
      # schema could fail the build with a confusing "not exported" error while
      # the step meant to prevent exactly that sat two steps too late.
      - name: Generate Prisma Client
        run: pnpm --filter=database exec prisma generate

      - name: Build web app
        run: pnpm --filter=web run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run unit tests
        run: pnpm --filter=web run test
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  docs-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Zero-dependency by design: runs before (and without) pnpm install,
      # so it can never rot behind a broken dependency tree.
      - run: node scripts/docs-truth.mjs
